<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JLMS —Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/jlms-core.css">
<style>
  .kpi-card.indigo { border-left: 4px solid #4f46e5; }
  .kpi-card.indigo .kpi-icon { background: #e0e7ff; color: #4f46e5; }
  .w1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--navy-700);
    line-height: 1.3;
    margin: 0;
}
</style>
</head>
<body>
<div class="app-shell">
  <div id="jlmsSidebarMount"></div>
  <div class="main-col">
    <div id="jlmsTopbarMount"></div>

    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="w1">Welcome, SuperAdmin</div>
          <div class="text-muted-jlms" style="margin-top:3px;" id="greetSubline">Manage branches, administrators, and bank accounts</div>
        </div>
        <div class="page-actions">
          <button class="btn-jlms btn-jlms-outline" onclick="location.reload()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        </div>
      </div>

      <div id="apiErrorBanner" class="api-error-banner"></div>

      <!-- KPI ROW -->
      <div class="row g-3 mb-4">
        <div class="col-xl-2-5 col-md-4">
          <div class="kpi-card indigo">
            <div class="kpi-top"><span class="kpi-label">Total Branches</span><div class="kpi-icon"><i class="bi bi-building"></i></div></div>
            <div class="kpi-value" id="kpiBranches">0</div>
            <div class="kpi-foot"><span class="text-muted-jlms">Registered locations</span></div>
          </div>
        </div>
        <div class="col-xl-2-5 col-md-4">
          <div class="kpi-card success">
            <div class="kpi-top"><span class="kpi-label">Total Admins</span><div class="kpi-icon success"><i class="bi bi-people"></i></div></div>
            <div class="kpi-value" id="kpiAdmins">0</div>
            <div class="kpi-foot"><span class="text-muted-jlms">Active administrators</span></div>
          </div>
        </div>
        <!-- <div class="col-xl-2-5 col-md-4">
          <div class="kpi-card gold">
            <div class="kpi-top"><span class="kpi-label">Total Banks</span><div class="kpi-icon gold"><i class="bi bi-bank"></i></div></div>
            <div class="kpi-value" id="kpiBanks">0</div>
            <div class="kpi-foot"><span class="text-muted-jlms">Registered banks</span></div>
          </div>
        </div> -->
        <!-- <div class="col-xl-2-5 col-md-6">
          <div class="kpi-card success">
            <div class="kpi-top"><span class="kpi-label">Today's Collections</span><div class="kpi-icon success"><i class="bi bi-graph-up"></i></div></div>
            <div class="kpi-value" id="kpiCollections">₹0</div>
            <div class="kpi-foot"><span class="text-muted-jlms">Aggregated today</span></div>
          </div>
        </div>
        <div class="col-xl-2-5 col-md-6">
          <div class="kpi-card info">
            <div class="kpi-top"><span class="kpi-label">Today's Disbursements</span><div class="kpi-icon info"><i class="bi bi-send-check"></i></div></div>
            <div class="kpi-value" id="kpiDisbursements">₹0</div>
            <div class="kpi-foot"><span class="text-muted-jlms">Aggregated today</span></div>
          </div>
        </div> -->
      </div>


      <!-- BRANCH GRID -->
      <div class="panel mb-4">
        <div class="panel-head">
          <div class="h4">Branch Management</div>
        </div>
        <div class="panel-body no-pad table-jlms-wrap">
          <table class="table-jlms">
            <thead>
              <tr>
                <th>Branch Code</th>
                <th>Branch Name</th>
                <th>Location</th>
                <th class="text-center">Status</th>
              </tr>
            </thead>
            <tbody id="tblBranchStats">
              <tr><td colspan="4" class="text-center text-muted-jlms" style="padding:24px;">Loading branch information...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
  window.JLMS_ACTIVE = "dashboard";
</script>
<script src="js/language.js"></script>
<script src="js/api-client.js"></script>
<script>
  // Redirect if not superadmin BEFORE initializing shell
  const checkUser = Session.requireLogin();
  const isSA = checkUser && (checkUser.username === 'superadmin' || checkUser.roleName === 'SuperAdmin' || checkUser.roleId === 1002);
  if (!isSA) {
    window.location.href = 'dashboard.html';
  }
</script>
<script src="js/jlms-shell.js"></script>
<script>
jlmsInitShell("SuperAdmin Dashboard", []);

function formatCurrency(n) {
  return '₹' + Number(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
}

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const summary = await Api.getSuperAdminSummary();
    
    // Set KPI cards
    document.getElementById('kpiBranches').textContent = summary.totalBranches.toLocaleString('en-IN');
    document.getElementById('kpiAdmins').textContent = summary.totalAdmins.toLocaleString('en-IN');
    // document.getElementById('kpiBanks').textContent = summary.totalBanks.toLocaleString('en-IN');

    // Set branch list table
    const tableBody = document.getElementById('tblBranchStats');
    if (!summary.branchStats || summary.branchStats.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted-jlms" style="padding:24px;">No branch information available.</td></tr>';
    } else {
      tableBody.innerHTML = summary.branchStats.map(b => `
        <tr>
          <td class="cell-strong">${b.branchCode}</td>
          <td>${b.branchName}</td>
          <td>${b.city || '—'}, ${b.state || '—'}</td>
          <td class="text-center">
            ${b.isActive 
              ? '<span class="badge-jlms badge-success"><span class="dot"></span>Active</span>' 
              : '<span class="badge-jlms badge-neutral"><span class="dot"></span>Inactive</span>'}
          </td>
        </tr>
      `).join('');
    }


  } catch (err) {
    showApiError(err);
  }
});

</script>
</body>
</html>
