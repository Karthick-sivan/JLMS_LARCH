<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JLMS — Loan Payment Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View loan payment report with daily payment tracking.">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/jlms-core.css">
    <style>
        .report-cat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--n-700);
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background .15s;
        }

        .report-cat-item:hover {
            background: var(--n-50);
        }

        .report-cat-item.active {
            background: var(--navy-50);
            color: var(--navy-700);
            border-left-color: var(--navy-700);
        }

        .report-cat-item .count {
            margin-left: auto;
            font-size: 10.5px;
            background: var(--n-150);
            color: var(--n-600);
            padding: 1px 7px;
            border-radius: 10px;
        }

        .report-cat-item.active .count {
            background: var(--navy-100);
            color: var(--navy-700);
        }

        #filterCustomer:disabled {
            opacity: 0.6;
        }

        .summary-cards {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .summary-card {
            flex: 1;
            min-width: 160px;
            background: #fff;
            border: 1px solid #eef0f3;
            border-radius: 10px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
        }

        .summary-card .sc-label {
            font-size: 11.5px;
            color: #9aa4b2;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 4px;
        }

        .summary-card .sc-value {
            font-size: 18px;
            font-weight: 700;
            color: #1e2a3a;
        }

        .summary-card.accent-orange .sc-value {
            color: #d97706;
        }

        .summary-card.accent-red .sc-value {
            color: #dc2626;
        }

        .summary-card.accent-navy .sc-value {
            color: var(--navy-700, #0d3b66);
        }

        .state-panel {
            text-align: center;
            padding: 52px 20px;
            color: #9aa4b2;
        }

        .state-panel i {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 12px;
        }

        .state-panel p {
            font-size: 14px;
            margin: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spin {
            display: inline-block;
            animation: spin .8s linear infinite;
        }

        .day-column {
            min-width: 45px;
            text-align: center;
            font-size: 11px;
        }

        .day-column .day-header {
            font-weight: 600;
            color: #6b7280;
            padding: 8px 4px;
        }

        .day-column .day-value {
            padding: 8px 4px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div id="jlmsSidebarMount"></div>
        <div class="main-col">
            <div id="jlmsTopbarMount"></div>
            <div class="page-content">
                <div class="row g-3">
                    <!-- Left: categories -->
                    <div class="col-lg-3">
                        <div class="panel">
                            <div class="panel-head">
                                <div class="h4" data-i18n="reportCategories">Report Categories</div>
                            </div>
                            <div class="panel-body" style="padding:6px 0;">
                                <div class="report-cat-item" onclick="location.href='activeloan-report.html'"><i
                                        class="bi bi-folder2-open"></i> <span data-i18n="loanReport">Loan Report</span>
                                </div>
                                <div class="report-cat-item" onclick="location.href='loandetails-report.html'"><i
                                        class="bi bi-graph-down"></i> <span data-i18n="loanItemReports">Loan & Item
                                        Reports</span></div>
                                <div class="report-cat-item" onclick="location.href='collection-reports.html'"><i
                                        class="bi bi-cash-coin"></i> <span data-i18n="collectionReports">Collection
                                        Reports</span>
                                </div>

                                <div class="report-cat-item" onclick="location.href='closureloan-report.html'"><i
                                        class="bi bi-check2-circle"></i> <span data-i18n="closedLoansReport">Closed
                                        Loans Report</span></div>
                                <div class="report-cat-item active"><i class="bi bi-calendar-check"></i> <span
                                        data-i18n="loanPaymentReport">Loan Payment Report</span>
                                </div>
                            </div>
                            
                        </div>
                    </div>

                    <!-- Right: filters + grid -->
                    <div class="col-lg-9">

                        <!-- Filters -->
                        <div class="panel mb-3">
                            <div class="panel-head">
                                <div class="h4" data-i18n="loanPaymentReport">Loan Payment Report — Filters</div>
                            </div>
                            <div class="panel-body">
                                <div class="row g-3 align-items-end">
                                    <div class="col-md-2">
                                        <label class="field-label" for="filterYear" data-i18n="year">Year</label>
                                        <select id="filterYear" class="form-select-jlms">
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="field-label" for="filterMonth" data-i18n="month">TXN Date</label>
                                        <select id="filterMonth" class="form-select-jlms">
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="field-label" for="filterCustomer"
                                            data-i18n="customer">Customer</label>
                                        <select id="filterCustomer" class="form-select-jlms" disabled>
                                            <option value="">Loading customers…</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label class="field-label" for="filterLoanNo" data-i18n="loanNo">Loan
                                            No.</label>
                                        <select id="filterLoanNo" class="form-select-jlms" disabled>
                                            <option value="">All Loans</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <button id="btnApplyFilters" class="btn-jlms btn-jlms-primary"
                                            style="width:100%;justify-content:center;">
                                            <i class="bi bi-funnel"></i> <span data-i18n="apply">Apply Filters</span>
                                        </button>
                                    </div>
                                </div>
                                <div id="apiErrorBanner" class="mt-3"
                                    style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:8px;padding:10px 14px;font-size:13px;">
                                </div>
                            </div>
                        </div>

                        <!-- Summary cards -->
                        <div class="summary-cards" id="summaryCards" style="display:none;">
                            <div class="summary-card">
                                <div class="sc-label" data-i18n="totalRecords">Total Records</div>
                                <div class="sc-value" id="scTotalRecords">—</div>
                            </div>
                            <div class="summary-card accent-navy">
                                <div class="sc-label" data-i18n="totalLoanAmount">Total Loan Amount</div>
                                <div class="sc-value" id="scLoanAmount">—</div>
                            </div>
                            <div class="summary-card accent-navy">
                                <div class="sc-label" data-i18n="principalCollected">Principal Collected</div>
                                <div class="sc-value" id="scPrincipal">—</div>
                            </div>
                            <div class="summary-card accent-orange">
                                <div class="sc-label" data-i18n="interestCollected">Interest Collected</div>
                                <div class="sc-value" id="scInterest">—</div>
                            </div>
                            <div class="summary-card accent-orange">
                                <div class="sc-label" data-i18n="totalPaidAmount">Total Paid Amount</div>
                                <div class="sc-value" id="scPaidAmount">—</div>
                            </div>
                            <div class="summary-card accent-red">
                                <div class="sc-label" data-i18n="totalBalanceAmount">Total Balance Amount</div>
                                <div class="sc-value" id="scBalanceAmount">—</div>
                            </div>
                        </div>

                        <!-- Results grid -->
                        <div class="panel">
                            <div class="grid-toolbar">
                                <div class="grid-toolbar-left">
                                    <span class="h4" data-i18n="results">Results</span>
                                    <span class="badge-jlms badge-neutral" id="recordsBadge"
                                        style="display:none;"></span>
                                </div>
                                <div class="grid-toolbar-left">
                                    <button class="btn-jlms btn-jlms-outline btn-sm" id="btnExportExcel"
                                        onclick="exportExcel()" style="display:none;"><i
                                            class="bi bi-file-earmark-excel"></i> <span data-i18n="exportExcel">Export
                                            Excel</span></button>
                                    <button class="btn-jlms btn-jlms-outline btn-sm" id="btnPrint"
                                        onclick="printReport()" style="display:none;"><i class="bi bi-printer"></i>
                                        <span data-i18n="print">Print</span></button>
                                </div>
                            </div>
                            <div class="panel-body no-pad table-jlms-wrap" style="overflow-x: auto;">
                                <table class="table-jlms" id="LoanPaymentTable">
                                    <thead id="loanPaymentTableHead">
                                        <!-- Dynamic headers will be generated here -->
                                    </thead>
                                    <tbody id="loanPaymentTableBody">
                                        <tr>
                                            <td colspan="10">
                                                <div class="state-panel">
                                                    <i class="bi bi-arrow-repeat spin"></i>
                                                    <p data-i18n="loadingLoanPaymentReport">Loading loan payment report…
                                                    </p>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                    <tfoot id="loanPaymentTableFoot" style="display:none;">
                                        <!-- Dynamic footer will be generated here -->
                                    </tfoot>
                                </table>
                            </div>
                            <div class="grid-footer" id="paginationFooter" style="display:none;">
                                <span id="paginationInfo" style="color:#6b7280;font-size:0.85rem;"></span>
                                <div class="pagination-jlms" id="paginationControls"></div>
                            </div>
                        </div>

                    </div>
                </div><!-- /row -->
            </div>
        </div>
    </div>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script>window.JLMS_ACTIVE = "loan-payment-report";</script>
    <script src="js/language.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/jlms-shell.js"></script>
    <script>
        jlmsInitShell();

        // ── Branch access restriction ───────────────────────────────
// Loan Payment Report is not available to Branch 1; every other branch can use it.
let __accessDenied = false;
const __currentUser = Session.get();
if (__currentUser && Number(__currentUser.branchId) === 1) {
    __accessDenied = true;
    document.querySelector(".page-content").innerHTML = `
        <div class="panel">
            <div class="panel-body">
                <div class="state-panel">
                    <i class="bi bi-shield-lock" style="color:#dc2626;"></i>
                    <p data-i18n="loanPaymentReportRestricted">
                        The Loan Payment Report is not available for your branch.
                    </p>
                </div>
            </div>
        </div>`;
}
        /* ════════════════════════════════════════════════════════════════
           Loan Payment Report – Page Logic
           ════════════════════════════════════════════════════════════════ */

        // ── State ──────────────────────────────────────────────────────
        let currentPage = 1;
        const PAGE_SIZE = 25;
        let lastResult = null;
        let activeFilters = {};

        // ── DOM refs ───────────────────────────────────────────────────
        const elYear = document.getElementById("filterYear");
        const elMonth = document.getElementById("filterMonth");
        const elCustomer = document.getElementById("filterCustomer");
        const elLoanNo = document.getElementById("filterLoanNo");
        const elApply = document.getElementById("btnApplyFilters");
        const elTHead = document.getElementById("loanPaymentTableHead");
        const elTBody = document.getElementById("loanPaymentTableBody");
        const elTFoot = document.getElementById("loanPaymentTableFoot");
        const elBadge = document.getElementById("recordsBadge");
        const elSummary = document.getElementById("summaryCards");
        const elPaginFoot = document.getElementById("paginationFooter");
        const elPaginInfo = document.getElementById("paginationInfo");
        const elPaginCtrls = document.getElementById("paginationControls");

        // ── Initialize Year and Month dropdowns ─────────────────────────
        (function () {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            // Populate year dropdown (last 5 years + current year)
            for (let y = currentYear - 5; y <= currentYear + 1; y++) {
                const opt = document.createElement("option");
                opt.value = y;
                opt.textContent = y;
                if (y === currentYear) opt.selected = true;
                elYear.appendChild(opt);
            }

            // Populate month dropdown
            const months = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            months.forEach((m, idx) => {
                const opt = document.createElement("option");
                opt.value = idx + 1;
                opt.textContent = m;
                if (idx + 1 === currentMonth) opt.selected = true;
                elMonth.appendChild(opt);
            });
        })();

        // ── Helpers ────────────────────────────────────────────────────
        function fmt(n) {
            if (n == null) return "—";
            return "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        function fmtDate(dt) {
            if (!dt) return "—";
            const d = new Date(dt);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = String(d.getFullYear()).slice(-2);
            return `${day}/${month}/${year}`;
        }

        function fmtDateFull(dt) {
            if (!dt) return "—";
            const d = new Date(dt);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function t(key, fallback) { return (lang && lang[key]) || fallback; }

        function setExportBtnsVisible(v) {
            ["btnExportExcel", "btnPrint"].forEach(id => {
                document.getElementById(id).style.display = v ? "" : "none";
            });
        }

        // ── Customer Dropdown ──────────────────────────────────────────
        async function loadCustomerDropdown() {
            try {
                const user = Session.get();
                const data = await Api.searchCustomers({ pageSize: 200, branchId: user?.branchId });
                const customers = data.items || [];
                elCustomer.innerHTML = `<option value="">All Customers</option>`;
                customers.forEach(c => {
                    const opt = document.createElement("option");
                    opt.value = c.customerId;
                    opt.textContent = `${c.customerName} (${c.customerCode})`;
                    elCustomer.appendChild(opt);
                });
            } catch (err) {
                console.error("Failed to load customers:", err);
            }
            elCustomer.disabled = false;
        }

        async function loadLoanDropdown(customerId) {
            elLoanNo.innerHTML = `<option value="">All Loans</option>`;
            if (!customerId) {
                elLoanNo.disabled = true;
                return;
            }
            elLoanNo.disabled = true;
            elLoanNo.innerHTML = `<option value="">Loading…</option>`;
            try {
                const loans = await Api.getLoansByCustomerForLoanPaymentReport(customerId);
                elLoanNo.innerHTML = `<option value="">All Loans</option>`;
                loans.forEach(l => {
                    const opt = document.createElement("option");
                    opt.value = l.loanId;
                    opt.textContent = `${l.loanNumber} (${l.status})`;
                    elLoanNo.appendChild(opt);
                });
            } catch {
                elLoanNo.innerHTML = `<option value="">All Loans</option>`;
            }
            elLoanNo.disabled = false;
        }

        elCustomer.addEventListener("change", () => {
            loadLoanDropdown(elCustomer.value);
        });

        // ── Build Table Headers ─────────────────────────────────────────
        function buildTableHeaders() {
            let html = `<tr>
                <th data-i18n="loanDate">Loan Date</th>
                <th data-i18n="loanNo">Loan No.</th>
                <th class="text-end" data-i18n="loanAmt">Loan Amt</th>
                <th data-i18n="customer">Customer Name</th>
                <th data-i18n="guardianName">Guardian Name</th>
                <th data-i18n="mobile">Mobile No</th>
                <th data-i18n="month">TXN Date</th>
                <th class="text-end" data-i18n="principalAmt">Principal Amt</th>
                <th class="text-end" data-i18n="interestAmt">Interest Amt</th>
                <th class="text-end" data-i18n="paidAmt">Paid Amt</th>
                <th class="text-end" data-i18n="balAmt">Bal Amt</th>
            </tr>`;

            elTHead.innerHTML = html;
        }

        // ── Load Report ────────────────────────────────────────────────
        async function loadReport(filters) {
            clearApiError();
            const params = { ...(filters || {}), page: currentPage, pageSize: PAGE_SIZE };

            elTBody.innerHTML = `<tr><td colspan="11"><div class="state-panel"><i class="bi bi-arrow-repeat spin"></i><p>${t("loading", "Loading…")}</p></div></td></tr>`;
            elTFoot.style.display = "none";
            elPaginFoot.style.display = "none";
            elBadge.style.display = "none";
            elSummary.style.display = "none";
            setExportBtnsVisible(false);

            try {
                const data = await Api.getLoanPaymentReport(params);
                lastResult = data;
                renderGrid(data);
            } catch (err) {
                showApiError(err);
                elTBody.innerHTML = `<tr><td colspan="11"><div class="state-panel"><i class="bi bi-exclamation-triangle" style="color:#dc2626;font-size:2.8rem;display:block;margin-bottom:12px;"></i><p>${t("failedToLoadReport", "Failed to load report. Check that the API is running.")}</p></div></td></tr>`;
            }
        }

        // ── Apply Filters button ───────────────────────────────────────
        elApply.addEventListener("click", () => {
            currentPage = 1;
            activeFilters = {
                year: parseInt(elYear.value),
                month: parseInt(elMonth.value),
                customerId: elCustomer.value || undefined,
                loanId: elLoanNo.value || undefined
            };
            loadReport(activeFilters);
        });

        // ── Render Grid ────────────────────────────────────────────────
        function renderGrid(data) {
            const { items, totalCount, page, pageSize, year, month,
                totalLoanAmount, totalPrincipalAmount, totalInterestAmount, totalPaidAmount, totalBalanceAmount } = data;

            document.getElementById("scTotalRecords").textContent = totalCount.toLocaleString("en-IN");
            document.getElementById("scLoanAmount").textContent = fmt(totalLoanAmount);
            document.getElementById("scPrincipal").textContent = fmt(totalPrincipalAmount);
            document.getElementById("scInterest").textContent = fmt(totalInterestAmount);
            document.getElementById("scPaidAmount").textContent = fmt(totalPaidAmount);
            document.getElementById("scBalanceAmount").textContent = fmt(totalBalanceAmount);
            elSummary.style.display = "flex";

            elBadge.textContent = t("xRecords", "{count} records").replace("{count}", totalCount.toLocaleString("en-IN"));
            elBadge.style.display = "";
            setExportBtnsVisible(totalCount > 0);

            if (!items || items.length === 0) {
                elTBody.innerHTML = `<tr><td colspan="11"><div class="state-panel"><i class="bi bi-inbox"></i><p>${t("noLoansFoundFilters", "No loans found for the selected filters.")}</p></div></td></tr>`;
                elTFoot.style.display = "none";
                elPaginFoot.style.display = "none";
                return;
            }

            let pgLoanAmt = 0, pgPrincipal = 0, pgInterest = 0, pgPaidAmt = 0, pgBalAmt = 0;

            const rows = items.map(row => {
                pgLoanAmt += row.loanAmount || 0;
                pgPrincipal += row.principalAmount || 0;
                pgInterest += row.interestAmount || 0;
                pgPaidAmt += row.paidAmount || 0;
                pgBalAmt += row.balanceAmount || 0;

                return `<tr>
                    <td>${fmtDate(row.loanDate)}</td>
                    <td>${row.loanNumber}</td>
                    <td class="text-end">${fmt(row.loanAmount)}</td>
                    <td>${row.customerName}</td>
                    <td>${row.guardianName || "—"}</td>
                    <td>${row.mobile}</td>
                    <td>${fmtDateFull(row.paymentDate)}</td>
                    <td class="text-end">${fmt(row.principalAmount)}</td>
                    <td class="text-end">${fmt(row.interestAmount)}</td>
                    <td class="text-end cell-strong">${fmt(row.paidAmount)}</td>
                    <td class="text-end">${fmt(row.balanceAmount)}</td>
                </tr>`;
            });

            elTBody.innerHTML = rows.join("");

            // Build footer totals
            let footerHtml = `<tr>
                <td colspan="2"><strong data-i18n="pageTotal">Page Total</strong></td>
                <td class="text-end">${fmt(pgLoanAmt)}</td>
                <td colspan="4"></td>
                <td class="text-end">${fmt(pgPrincipal)}</td>
                <td class="text-end">${fmt(pgInterest)}</td>
                <td class="text-end">${fmt(pgPaidAmt)}</td>
                <td class="text-end"></td>
            </tr>`;

            elTFoot.innerHTML = footerHtml;
            elTFoot.style.display = "";

            renderPagination(totalCount, page, pageSize);
        }

        // ── Pagination ─────────────────────────────────────────────────
        function renderPagination(totalCount, page, pageSize) {
            const totalPages = Math.ceil(totalCount / pageSize);
            const from = (page - 1) * pageSize + 1;
            const to = Math.min(page * pageSize, totalCount);
            elPaginInfo.textContent = t("showingXofY", "Showing {from}\u2013{to} of {total}")
                .replace("{from}", from).replace("{to}", to).replace("{total}", totalCount.toLocaleString("en-IN"));

            let html = `<div class="page-btn${page === 1 ? " disabled" : ""}" onclick="goPage(${page - 1})"><i class="bi bi-chevron-left"></i></div>`;
            let sp = Math.max(1, page - 2), ep = Math.min(totalPages, sp + 4);
            if (ep - sp < 4) sp = Math.max(1, ep - 4);
            for (let p = sp; p <= ep; p++)
                html += `<div class="page-btn${p === page ? " active" : ""}" onclick="goPage(${p})">${p}</div>`;
            html += `<div class="page-btn${page === totalPages ? " disabled" : ""}" onclick="goPage(${page + 1})"><i class="bi bi-chevron-right"></i></div>`;
            elPaginCtrls.innerHTML = html;
            elPaginFoot.style.display = "";
        }

        function goPage(p) {
            if (p < 1 || !lastResult) return;
            if (p > Math.ceil(lastResult.totalCount / PAGE_SIZE)) return;
            currentPage = p;
            loadReport(activeFilters);
        }

        // ── Export / Print ─────────────────────────────────────────────
        function exportExcel() {
            if (!lastResult || !lastResult.items || lastResult.items.length === 0) return;

            const header = ["Loan Date", "Loan No.", "Loan Amt", "Customer Name", "Guardian Name", "Mobile No", "TXN Date", "Principal Amt", "Interest Amt", "Paid Amt", "Bal Amt", "Book No"];

            const rows = lastResult.items.map(row => {
                return [
                    fmtDate(row.loanDate),
                    row.loanNumber,
                    row.loanAmount || 0,
                    row.customerName,
                    row.guardianName || "",
                    row.mobile,
                    fmtDateFull(row.paymentDate),
                    row.principalAmount || 0,
                    row.interestAmount || 0,
                    row.paidAmount || 0,
                    row.balanceAmount || 0,
                    row.bookNo
                ];
            });

            const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);

            // Format amount columns as currency
            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = 2; C <= range.e.c; ++C) {  // Start from column 2 (Loan Amt)
                    const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!ws[cellAddress]) continue;
                    ws[cellAddress].z = '"₹"#,##0';
                }
            }

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Loan Payment Report");
            XLSX.writeFile(wb, `LoanPaymentReport_${elYear.value}_${elMonth.value}.xlsx`);
        }

        function printReport() {
            window.print();
        }

        function clearApiError() {
            document.getElementById("apiErrorBanner").style.display = "none";
        }

        function showApiError(err) {
            const banner = document.getElementById("apiErrorBanner");
            banner.textContent = err.message || "An error occurred while loading the report.";
            banner.style.display = "";
        }

        // ── Initial load ───────────────────────────────────────────────
       if (!__accessDenied) {
    buildTableHeaders();
    loadCustomerDropdown();
    // Auto-load with current month on page load
    elApply.click();
}
