<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JLMS — Create Administrator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/jlms-core.css">
</head>

<body>
    <div class="app-shell">
        <div id="jlmsSidebarMount"></div>
        <div class="main-col">
            <div id="jlmsTopbarMount"></div>
            <div class="page-content">
                <div class="page-header" style="flex-wrap: wrap; gap: 16px;">
                    <div id="apiErrorBanner" class="api-error-banner" style="display:none; width: 100%;"></div>
                    <div id="apiSuccessBanner" class="api-success-banner" style="display:none; width: 100%;"></div>
                    <div>
                        <div class="h1">Create Administrator / System Users</div>
                    </div>
                    <div class="page-actions">
                        <button class="btn-jlms btn-jlms-primary" id="btnNewUser"
                            onclick="window.location.href='user-form.html?mode=admin'"><i class="bi bi-person-plus"></i>
                            New User / Admin</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="grid-toolbar">
                        <div class="grid-toolbar-left">
                            <span class="h4">System Users</span>
                            <span class="badge-jlms badge-neutral" id="txtUserCount">0 users</span>
                        </div>
                        <div class="grid-toolbar-left">
                            <select class="form-select-jlms" id="ddlRoleFilter" style="width:160px;">
                                <option value="">All Roles</option>
                            </select>
                            <div class="grid-search"><i class="bi bi-search"></i><input id="txtSearchUser"
                                    placeholder="Search user"></div>
                        </div>
                    </div>
                    <div class="panel-body no-pad table-jlms-wrap">
                        <table class="table-jlms">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Username</th>
                                    <th>Branch</th>
                                    <th>Mobile</th>
                                    <th class="text-center">Status</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tblUsers">
                                <tr>
                                    <td colspan="7" class="text-center text-muted-jlms" style="padding: 24px;">Loading
                                        users...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="grid-footer">
                        <span id="txtShowingText">Showing 0–0 of 0</span>
                        <div class="pagination-jlms" id="paginationWrap"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>window.JLMS_ACTIVE = "create-administrator";</script>
    <script src="js/language.js"></script>
    <script src="js/api-client.js"></script>
    <script>
        // Redirect if not superadmin BEFORE initializing shell
        const checkUser = Session.requireLogin();
        const isSA = checkUser && (checkUser.username === 'superadmin' || checkUser.roleName === 'SuperAdmin' || checkUser.roleId === 1002);
        if (!isSA) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <script src="js/jlms-shell.js"></script>
    <script>
        jlmsInitShell("Create Administrator", []);

        let allUsers = [];
        let filteredUsers = [];
        let currentPage = 1;
        const pageSize = 10;

        document.addEventListener('DOMContentLoaded', async () => {
            const ddlRoleFilter = document.getElementById('ddlRoleFilter');
            const txtSearchUser = document.getElementById('txtSearchUser');
            const tblUsers = document.getElementById('tblUsers');
            const txtUserCount = document.getElementById('txtUserCount');
            const txtShowingText = document.getElementById('txtShowingText');
            const paginationWrap = document.getElementById('paginationWrap');
            const apiSuccessBanner = document.getElementById('apiSuccessBanner');
            const apiErrorBanner = document.getElementById('apiErrorBanner');

            // Show success message when returning from user-form
            const formSuccess = sessionStorage.getItem('jlms_form_success');
            if (formSuccess) {
                sessionStorage.removeItem('jlms_form_success');
                showSuccess(formSuccess);
            }

            ddlRoleFilter.addEventListener('change', () => {currentPage = 1; filterAndRender();});
            txtSearchUser.addEventListener('input', () => {currentPage = 1; filterAndRender();});

            await initPage();

            async function initPage() {
                try {
                    apiErrorBanner.style.display = 'none';
                    const rolesList = await Api.getUserMasterRoles();
                    ddlRoleFilter.innerHTML = '<option value="">All Roles</option>' +
                        rolesList.map(r => `<option value="${r.roleId}">${r.roleName}</option>`).join('');
                    await loadUsers();
                } catch (err) {showApiError(err);}
            }

            async function loadUsers() {
                try {
                    allUsers = await Api.getUsers();
                    filterAndRender();
                } catch (err) {showApiError(err);}
            }

            function filterAndRender() {
                const sel = ddlRoleFilter.value;
                const query = txtSearchUser.value.trim().toLowerCase();
                filteredUsers = allUsers.filter(u => {
                    const okRole = !sel || u.roleId == sel;
                    const okSearch = !query ||
                        u.employeeCode.toLowerCase().includes(query) ||
                        u.fullName.toLowerCase().includes(query) ||
                        u.username.toLowerCase().includes(query) ||
                        (u.mobile && u.mobile.toLowerCase().includes(query));
                    return okRole && okSearch;
                });
                txtUserCount.textContent = `${filteredUsers.length} user${filteredUsers.length === 1 ? '' : 's'}`;
                renderTable();
            }

            function initials(name) {
                if (!name) return '';
                return name.split(' ').map(p => p[0]).join('').substring(0, 2).toUpperCase();
            }

            function getRoleBadgeClass(roleName) {
                const n = roleName.toLowerCase();
                if (n.includes('administrator')) return 'badge-danger';
                if (n.includes('manager')) return 'badge-info';
                if (n.includes('officer')) return 'badge-gold';
                return 'badge-neutral';
            }

            function renderTable() {
                tblUsers.innerHTML = '';
                if (filteredUsers.length === 0) {
                    tblUsers.innerHTML = `<tr><td colspan="7" class="text-center text-muted-jlms" style="padding:24px;">No users found.</td></tr>`;
                    txtShowingText.textContent = 'Showing 0\u20130 of 0';
                    paginationWrap.innerHTML = '';
                    return;
                }
                const total = filteredUsers.length;
                const totalPages = Math.ceil(total / pageSize);
                if (currentPage > totalPages) currentPage = totalPages || 1;
                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, total);
                txtShowingText.textContent = `Showing ${start + 1}\u2013${end} of ${total}`;

                filteredUsers.slice(start, end).forEach(u => {
                    const statusBadge = u.isActive
                        ? '<span class="badge-jlms badge-success"><span class="dot"></span>Active</span>'
                        : '<span class="badge-jlms badge-neutral"><span class="dot"></span>Inactive</span>';
                    const roleClass = getRoleBadgeClass(u.roleName);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
    <td>
        <div style="display:flex;align-items:center;gap:8px;">
            <div class="avatar-sm">${initials(u.fullName)}</div>
            ${u.fullName}
        </div>
    </td>
    <td>${u.username}</td>
    <td>${u.branchName || '\u2014'}</td>
    <td>${u.mobile || '\u2014'}</td>
    <td class="text-center">${statusBadge}</td>
    <td class="text-center">
        <i class="bi bi-pencil edit-btn"
           data-id="${u.userId}"
           style="margin-right:10px;color:var(--n-500);cursor:pointer;"
           title="Edit"></i>

        <i class="bi ${u.isActive ? 'bi-shield-lock' : 'bi-shield-fill-check'} toggle-btn"
           data-id="${u.userId}"
           style="color:var(--n-500);cursor:pointer;"
           title="${u.isActive ? 'Deactivate' : 'Activate'}"></i>
    </td>`;
                    tblUsers.appendChild(tr);
                });

                tblUsers.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const u = allUsers.find(x => x.userId === Number(btn.dataset.id));
                        if (u) {
                            sessionStorage.setItem('jlms_edit_user', JSON.stringify(u));
                            window.location.href = `user-form.html?userId=${u.userId}&mode=admin`;
                        }
                    });
                });
                tblUsers.querySelectorAll('.toggle-btn').forEach(btn => {
                    btn.addEventListener('click', () => toggleStatus(Number(btn.dataset.id)));
                });
                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                paginationWrap.innerHTML = '';
                if (totalPages <= 1) return;
                const prevBtn = document.createElement('div');
                prevBtn.className = `page-btn ${currentPage === 1 ? 'disabled' : ''}`;
                prevBtn.innerHTML = '<i class="bi bi-chevron-left"></i>';
                if (currentPage > 1) prevBtn.addEventListener('click', () => {currentPage--; renderTable();});
                paginationWrap.appendChild(prevBtn);
                for (let i = 1; i <= totalPages; i++) {
                    const pb = document.createElement('div');
                    pb.className = `page-btn ${currentPage === i ? 'active' : ''}`;
                    pb.textContent = i;
                    pb.addEventListener('click', () => {currentPage = i; renderTable();});
                    paginationWrap.appendChild(pb);
                }
                const nextBtn = document.createElement('div');
                nextBtn.className = `page-btn ${currentPage === totalPages ? 'disabled' : ''}`;
                nextBtn.innerHTML = '<i class="bi bi-chevron-right"></i>';
                if (currentPage < totalPages) nextBtn.addEventListener('click', () => {currentPage++; renderTable();});
                paginationWrap.appendChild(nextBtn);
            }

            async function toggleStatus(id) {
                apiErrorBanner.style.display = 'none';
                try {
                    const result = await Api.toggleUserStatus(id);
                    const u = allUsers.find(x => x.userId === id);
                    if (u) {u.isActive = result.isActive; filterAndRender();}
                    showSuccess(`User has been ${result.isActive ? 'activated' : 'deactivated'}.`);
                } catch (err) {showApiError(err);}
            }

            function showSuccess(msg) {
                apiSuccessBanner.textContent = msg;
                apiSuccessBanner.style.display = 'block';
                setTimeout(() => {apiSuccessBanner.style.display = 'none';}, 4000);
            }

            function showApiError(err) {
                apiErrorBanner.textContent = err.message || 'An error occurred.';
                apiErrorBanner.style.display = 'block';
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        });
    </script>
</body>

</html>
